plugins { id 'com.android.application' }

android {
    namespace 'io.github.appunnim.businessgate'
    compileSdk 36
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId 'io.github.appunnim.businessgate'
        minSdk 29
        targetSdk 36
        versionCode 1
        versionName '0.1.0'
        testInstrumentationRunner 'io.github.appunnim.businessgate.GateInstrumentation'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures { buildConfig true }
    buildTypes {
        debug { applicationIdSuffix '.debug' }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    lint { abortOnError true; checkReleaseBuilds true; warningsAsErrors true }
}

// The application has no runtime dependencies. The platform-only test harness
// uses Instrumentation directly; the pure safety suite runs with scripts/test.sh.
