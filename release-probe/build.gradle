plugins { id 'com.android.application' }
android {
    namespace 'io.github.appunnim.businessgate.probe'
    compileSdk 36
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId 'io.github.appunnim.businessgate.probe'
        minSdk 29
        targetSdk 36
        versionCode 1
        versionName '1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint {
        abortOnError true; warningsAsErrors true
        // Match the app's deliberately pinned API 36 baseline, independent of runner SDK updates.
        disable 'OldTargetApi'
    }
}
// Isolated test tool: no application dependency and no publisher-key access.
