name: Android build and delivery
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4.0.1
      - name: Install pinned SDK components
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Verify wrapper checksum
        run: python3 scripts/check_wrapper.py
      - name: Pure safety, schema and independent-branding rules
        run: scripts/test.sh
      - name: Compile and lint
        run: |
          version_code=$((100000 + GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))
          version_name="0.1.0-dev.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          test "$GITHUB_RUN_ATTEMPT" -lt 100
          if ! ./gradlew -PgateVersionCode="$version_code" -PgateVersionName="$version_name" \
            :app:lintDebug :app:lintRelease :app:assembleDebug :app:assembleDebugAndroidTest \
            :app:assembleRelease :app:bundleRelease :release-probe:lintDebug :release-probe:assembleDebug; then
            for report in app/build/intermediates/lint_intermediate_text_report/*/lintReport*/lint-results-*.txt; do
              if [ -f "$report" ]; then cat "$report"; fi
            done
            exit 1
          fi
      - name: Audit release contents
        run: python3 scripts/audit_artifact.py app/build/outputs/apk/release/app-release-unsigned.apk
      - name: Enforce artifact naming rule
        run: python3 scripts/check_brand.py app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/release/app-release-unsigned.apk app/build/outputs/bundle/release/app-release.aab release-probe/build/outputs/apk/debug/release-probe-debug.apk
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Native persistence, UI and restart tests
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: GATE_TEST_SERIAL=emulator-5554 scripts/device-tests.sh && GATE_TEST_SERIAL=emulator-5554 scripts/ui-layout-tests.sh
      - name: Preserve verified build inputs
        uses: actions/upload-artifact@v7.0.1
        with:
          name: verified-android-build
          retention-days: 14
          if-no-files-found: error
          path: |
            app/build/outputs/apk/release/app-release-unsigned.apk
            app/build/outputs/mapping/release/mapping.txt
      - name: Preserve isolated release test tool
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-upgrade-probe
          retention-days: 14
          if-no-files-found: error
          path: release-probe/build/outputs/apk/debug/release-probe-debug.apk
      - name: Preserve reports and development build
        uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: verification-reports
          retention-days: 14
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/lint-results-*.html
            output/device-tests/*.txt
            output/ui-layout/*.png

  deliver:
    needs: verify
    if: github.repository == 'appunni-m/business-gate' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4.0.1
      - name: Install pinned build tools
        run: sdkmanager 'build-tools;35.0.0'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-android-build
          path: app/build/outputs
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-upgrade-probe
          path: output/probe
      - name: Sign APK with private publisher key
        env:
          ANDROID_SIGNING: ${{ secrets.ANDROID_SIGNING }}
        run: python3 scripts/sign_apk.py app/build/outputs/apk/release/app-release-unsigned.apk output/delivery/business-gate.apk
      - name: Audit the signed distributable
        run: |
          python3 scripts/audit_artifact.py output/delivery/business-gate.apk
          python3 scripts/check_brand.py output/delivery/business-gate.apk
          python3 scripts/release_metadata.py
          python3 scripts/check_brand.py output/delivery/build-info.json output/delivery/RELEASE_NOTES.md
      - name: Download previous release for update verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
          if python3 - "$RUNNER_TEMP/releases.json" <<'PY'
          import json, sys
          pages = json.load(open(sys.argv[1]))
          sys.exit(0 if any(r['tag_name'] == 'development' for p in pages for r in p) else 1)
          PY
          then
            gh release download development --repo "$GITHUB_REPOSITORY" --pattern business-gate.apk --dir output/previous
          fi
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify signed install and update on minimum Android version
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 29
          target: default
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: GATE_TEST_SERIAL=emulator-5554 scripts/release-upgrade-test.sh output/probe/release-probe-debug.apk output/delivery/business-gate.apk output/previous/business-gate.apk
      - name: Preserve signed download
        uses: actions/upload-artifact@v7.0.1
        with:
          name: business-gate-installable-apk
          retention-days: 90
          if-no-files-found: error
          path: |
            output/delivery/business-gate.apk
            output/delivery/SHA256SUMS
            output/delivery/build-info.json
      - name: Preserve signed upgrade evidence
        uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: signed-upgrade-evidence
          retention-days: 14
          path: output/device-tests/*.txt
      - name: Publish versioned release and continuous APK link
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish_release.py
