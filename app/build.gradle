plugins { id 'com.android.application' }

def gateCode = providers.gradleProperty('gateVersionCode').getOrElse('1').toInteger()
def gateName = providers.gradleProperty('gateVersionName').getOrElse('0.1.0')
if (gateCode < 1 || gateCode > 2100000000) {
    throw new GradleException('gateVersionCode must be between 1 and 2100000000')
}
if (!(gateName ==~ /[0-9A-Za-z.+-]{1,80}/)) {
    throw new GradleException('gateVersionName contains invalid characters')
}

android {
    namespace 'io.github.appunnim.businessgate'
    compileSdk 36
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId 'io.github.appunnim.businessgate'
        minSdk 29
        targetSdk 36
        versionCode gateCode
        versionName gateName
        testInstrumentationRunner 'io.github.appunnim.businessgate.GateInstrumentation'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures { buildConfig true }
    buildTypes {
        debug { applicationIdSuffix '.debug' }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    lint {
        abortOnError true; checkReleaseBuilds true; warningsAsErrors true
        // API 36 is the tested distribution baseline. A newly published SDK is a separate qualification change.
        disable 'OldTargetApi'
    }
}

// The application has no runtime dependencies. The platform-only test harness
// uses Instrumentation directly; the pure safety suite runs with scripts/test.sh.
